{% extends "admin/base_site.html" %}

{% block title %}👁️ {{ title }}{% endblock %}

{% block content %}
<style>
    .preview-container {
        max-width: 1000px;
        margin: 20px auto;
        background: #fff;
        border: 2px solid #333;
        padding: 20px;
        box-shadow: 4px 4px 0px #000;
    }
    
    .preview-container h2 {
        font-family: 'Times New Roman', serif;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
        margin-top: 0;
    }

    /* Style the table generated by Pandas */
    .preview-table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: monospace;
        font-size: 13px;
    }

    .preview-table th, .preview-table td {
        border: 1px solid #333;
        padding: 8px;
        text-align: left;
    }

    .preview-table th {
        background-color: #eee;
        font-weight: bold;
    }

    .btn-back {
        display: inline-block;
        padding: 8px 16px;
        background: #333;
        color: white;
        text-decoration: none;
        font-family: monospace;
        font-weight: bold;
        border: 2px solid #000;
        box-shadow: 2px 2px 0px #000;
        margin-top: 20px;
    }
    
    .btn-dl {
        background: #28a745;
        margin-left: 10px;
    }

    .btn-back:active, .btn-dl:active {
        box-shadow: 0px 0px 0px #000;
        transform: translate(2px, 2px);
    }
</style>

<div class="preview-container">
    <h2>{{ title }} (First 15 Rows)</h2>
    
    <div style="overflow-x: auto;">
        {{ html_table|safe }}
    </div>

    <a href="javascript:history.back()" class="btn-back">⬅️ Back to Reports</a>
    
    <!-- Script to rewrite the URL action to download -->
    <a href="#" onclick="window.location.href = window.location.href.replace('mode=preview', 'mode=download'); return false;" class="btn-back btn-dl">&#128229; Download Full Excel</a>
</div>
{% endblock %}
